<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/base :: sidebar(${activePage})}"></div>

    <div class="app-main">
        <!-- Header -->
        <header th:replace="~{layout/base :: header(${pageTitle}, 'Home / Categories / ' + ${pageTitle})}"></header>

        <!-- Content -->
        <main class="app-content">
            <!-- Alerts -->
            <div th:replace="~{layout/base :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-enterprise">
                        <div class="card-header-enterprise">
                            <h2 class="card-title-enterprise" th:text="${pageTitle}">Add Category</h2>
                            <a th:href="@{/categories}" class="btn-secondary-enterprise">
                                <i class="bi bi-arrow-left"></i>
                                <span>Back to Categories</span>
                            </a>
                        </div>

                        <div class="card-body-enterprise">
                            <form th:action="@{/categories/save}" th:object="${category}" method="post">
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label for="name" class="form-label-enterprise">Category Name *</label>
                                    <input type="text" id="name" th:field="*{name}" 
                                           class="form-control-enterprise" placeholder="e.g. Computing Hardware" required>
                                    <div class="form-text-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                                </div>

                                <div class="mb-4">
                                    <label for="description" class="form-label-enterprise">Description</label>
                                    <textarea id="description" th:field="*{description}" rows="3" 
                                              class="form-control-enterprise" placeholder="Describe the product group"></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/categories}" class="btn-secondary-enterprise">Cancel</a>
                                    <button type="submit" class="btn-primary-enterprise">
                                        <i class="bi bi-check-circle"></i>
                                        <span>Save Category</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
