<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Product Categories')}"></head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/base :: sidebar(${activePage})}"></div>

    <div class="app-main">
        <!-- Header -->
        <header th:replace="~{layout/base :: header('Category Management', 'Home / Categories')}"></header>

        <!-- Content -->
        <main class="app-content">
            <!-- Alerts -->
            <div th:replace="~{layout/base :: alerts}"></div>

            <div class="card-enterprise">
                <div class="card-header-enterprise">
                    <div class="d-flex align-items-center gap-2">
                        <h2 class="card-title-enterprise">Product Categories</h2>
                        <span class="badge bg-light text-secondary border" th:text="${categories.size()} + ' Categories'">0 Categories</span>
                    </div>
                    <a th:href="@{/categories/new}" class="btn-primary-enterprise">
                        <i class="bi bi-plus-lg"></i>
                        <span>Add Category</span>
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table-enterprise">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Associated Products</th>
                                <th>Created Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td class="text-muted small" th:text="${cat.id}">1</td>
                                <td>
                                    <a th:href="@{/categories/view/{id}(id=${cat.id})}" class="fw-semibold text-dark text-decoration-none" th:text="${cat.name}">Category Name</a>
                                </td>
                                <td class="text-muted small" th:text="${cat.description != null ? cat.description : 'None'}">Description</td>
                                <td>
                                    <span class="badge bg-light text-primary border fw-semibold" th:text="${cat.productCount} + ' Items'">0 Items</span>
                                </td>
                                <td class="text-muted small" th:text="${#temporals.format(cat.createdAt, 'yyyy/MM/dd')}">2026/11/03</td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/categories/view/{id}(id=${cat.id})}" class="btn-action-icon" title="View Products in Category">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/categories/edit/{id}(id=${cat.id})}" class="btn-action-icon" title="Edit Category">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/categories/delete/{id}(id=${cat.id})}" class="btn-action-icon delete" 
                                           onclick="return confirmDelete('category')" title="Delete Category">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <div>No categories configured</div>
                                    <a th:href="@{/categories/new}" class="btn-primary-enterprise mt-2">Create First Category</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
