<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Suppliers')}"></head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/base :: sidebar(${activePage})}"></div>

    <div class="app-main">
        <!-- Header -->
        <header th:replace="~{layout/base :: header('Supplier Directory', 'Home / Suppliers')}"></header>

        <!-- Content -->
        <main class="app-content">
            <!-- Alerts -->
            <div th:replace="~{layout/base :: alerts}"></div>

            <div class="card-enterprise">
                <div class="card-header-enterprise">
                    <div class="d-flex align-items-center gap-2">
                        <h2 class="card-title-enterprise">Supplier Directory</h2>
                        <span class="badge bg-light text-secondary border" th:text="${suppliers.size()} + ' Suppliers'">0 Suppliers</span>
                    </div>
                    <a th:href="@{/suppliers/new}" class="btn-primary-enterprise">
                        <i class="bi bi-plus-lg"></i>
                        <span>Add Supplier</span>
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table-enterprise">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Supplier Name</th>
                                <th>Contact Person</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Supplied Products</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${suppliers}">
                                <td class="text-muted small" th:text="${s.id}">1</td>
                                <td class="fw-semibold text-dark" th:text="${s.name}">Apex Industrial Supplies</td>
                                <td th:text="${s.contactPerson != null ? s.contactPerson : 'None'}">Robert Vance</td>
                                <td class="text-muted small" th:text="${s.email != null ? s.email : 'None'}">contact@apexsupplies.com</td>
                                <td class="text-muted small" th:text="${s.phone != null ? s.phone : 'None'}">+1 555 0192</td>
                                <td class="text-muted small" th:text="${s.address != null ? s.address : 'None'}">Address</td>
                                <td>
                                    <span class="badge bg-light text-primary border fw-semibold" th:text="${s.productCount} + ' Items'">0 Items</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/suppliers/edit/{id}(id=${s.id})}" class="btn-action-icon" title="Edit Supplier">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/suppliers/delete/{id}(id=${s.id})}" class="btn-action-icon delete" 
                                           onclick="return confirmDelete('supplier')" title="Delete Supplier">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(suppliers)}">
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <div>No suppliers configured</div>
                                    <a th:href="@{/suppliers/new}" class="btn-primary-enterprise mt-2">Add First Supplier</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
