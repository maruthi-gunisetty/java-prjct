<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Stock Out Operation')}"></head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/base :: sidebar(${activePage})}"></div>

    <div class="app-main">
        <!-- Header -->
        <header th:replace="~{layout/base :: header('Stock Out (Dispatch Inventory)', 'Home / Stock / Stock Out')}"></header>

        <!-- Content -->
        <main class="app-content">
            <!-- Alerts -->
            <div th:replace="~{layout/base :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-enterprise">
                        <div class="card-header-enterprise">
                            <div>
                                <h2 class="card-title-enterprise">Record Outgoing Stock</h2>
                                <p class="text-muted small mb-0">Outgoing units will automatically deduct from available inventory</p>
                            </div>
                            <a th:href="@{/stock/history}" class="btn-secondary-enterprise">
                                <i class="bi bi-clock-history"></i>
                                <span>Transaction History</span>
                            </a>
                        </div>

                        <div class="card-body-enterprise">
                            <form th:action="@{/stock/out}" method="post">
                                <div class="mb-3">
                                    <label for="productId" class="form-label-enterprise">Select Product *</label>
                                    <select id="productId" name="productId" class="form-select-enterprise" required>
                                        <option value="">Choose Product</option>
                                        <option th:each="p : ${products}" 
                                                th:value="${p.id}" 
                                                th:text="${p.name} + ' (' + ${p.sku} + ') | Available Stock: ' + ${p.quantity}"
                                                th:selected="${selectedProductId == p.id}">
                                            Product Name (SKU)
                                        </option>
                                    </select>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="quantity" class="form-label-enterprise">Outgoing Quantity *</label>
                                        <input type="number" min="1" id="quantity" name="quantity" 
                                               class="form-control-enterprise" placeholder="e.g. 10" required>
                                        <div class="text-muted small mt-1">Cannot exceed currently available units</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="referenceNumber" class="form-label-enterprise">Sales Order or Requisition Number</label>
                                        <input type="text" id="referenceNumber" name="referenceNumber" 
                                               class="form-control-enterprise" placeholder="e.g. SO2006">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="notes" class="form-label-enterprise">Transaction Reason or Destination</label>
                                    <textarea id="notes" name="notes" rows="3" 
                                              class="form-control-enterprise" placeholder="Client delivery, internal consumption, or branch dispatch"></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard}" class="btn-secondary-enterprise">Cancel</a>
                                    <button type="submit" class="btn-danger-enterprise">
                                        <i class="bi bi-arrow-up-right-square"></i>
                                        <span>Confirm Stock Out</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
