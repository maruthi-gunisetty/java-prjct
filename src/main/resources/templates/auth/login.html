<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="mb-2">
                <i class="bi bi-shield-lock text-primary fs-1"></i>
            </div>
            <h2>Inventory System</h2>
            <p>Enterprise Administrative Portal</p>
        </div>

        <div class="login-body-content">
            <!-- Alert Messages -->
            <div th:if="${errorMessage != null}" class="alert-enterprise error mb-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    <span th:text="${errorMessage}">Invalid credentials</span>
                </div>
            </div>

            <div th:if="${infoMessage != null}" class="alert-enterprise info mb-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-info-circle me-2"></i>
                    <span th:text="${infoMessage}">Logged out successfully</span>
                </div>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label-enterprise">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" id="username" name="username" class="form-control-enterprise border-start-0" 
                               placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label-enterprise">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-key text-muted"></i>
                        </span>
                        <input type="password" id="password" name="password" class="form-control-enterprise border-start-0" 
                               placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center text-muted small">
                <div class="fw-semibold text-secondary mb-1">Default Demonstration Account</div>
                <div>Username: <code class="text-primary">admin</code></div>
                <div>Password: <code class="text-primary">admin123</code></div>
            </div>
        </div>
    </div>

</body>
</html>
