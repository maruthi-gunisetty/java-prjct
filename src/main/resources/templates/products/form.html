<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/base :: sidebar(${activePage})}"></div>

    <div class="app-main">
        <!-- Header -->
        <header th:replace="~{layout/base :: header(${pageTitle}, 'Home / Products / ' + ${pageTitle})}"></header>

        <!-- Content -->
        <main class="app-content">
            <!-- Alerts -->
            <div th:replace="~{layout/base :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card-enterprise">
                        <div class="card-header-enterprise">
                            <h2 class="card-title-enterprise" th:text="${pageTitle}">Add Product</h2>
                            <a th:href="@{/products}" class="btn-secondary-enterprise">
                                <i class="bi bi-arrow-left"></i>
                                <span>Back to Products</span>
                            </a>
                        </div>

                        <div class="card-body-enterprise">
                            <form th:action="@{/products/save}" th:object="${product}" method="post">
                                <input type="hidden" th:field="*{id}">

                                <div class="row g-3 mb-3">
                                    <div class="col-md-8">
                                        <label for="name" class="form-label-enterprise">Product Name *</label>
                                        <input type="text" id="name" th:field="*{name}" 
                                               class="form-control-enterprise" placeholder="Enter full product name" required>
                                        <div class="form-text-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="sku" class="form-label-enterprise">SKU Code *</label>
                                        <input type="text" id="sku" th:field="*{sku}" 
                                               class="form-control-enterprise" placeholder="e.g. SKU1001" required>
                                        <div class="form-text-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}">SKU error</div>
                                        <div class="text-muted small mt-1">Must be unique across entire inventory</div>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="category" class="form-label-enterprise">Category *</label>
                                        <select id="category" th:field="*{category}" class="form-select-enterprise" required>
                                            <option value="">Select Category</option>
                                            <option th:each="cat : ${categories}" 
                                                    th:value="${cat.id}" 
                                                    th:text="${cat.name}">Category</option>
                                        </select>
                                        <div class="form-text-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category error</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="supplier" class="form-label-enterprise">Supplier</label>
                                        <select id="supplier" th:field="*{supplier}" class="form-select-enterprise">
                                            <option value="">Select Supplier (Optional)</option>
                                            <option th:each="sup : ${suppliers}" 
                                                    th:value="${sup.id}" 
                                                    th:text="${sup.name}">Supplier</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-4">
                                        <label for="unitPrice" class="form-label-enterprise">Unit Price ($) *</label>
                                        <input type="number" step="0.01" min="0.01" id="unitPrice" th:field="*{unitPrice}" 
                                               class="form-control-enterprise" placeholder="0.00" required>
                                        <div class="form-text-error" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}">Price error</div>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="quantity" class="form-label-enterprise">Initial Stock Quantity *</label>
                                        <input type="number" min="0" id="quantity" th:field="*{quantity}" 
                                               class="form-control-enterprise" placeholder="0" required>
                                        <div class="form-text-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">Quantity error</div>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="minStockLevel" class="form-label-enterprise">Minimum Stock Level *</label>
                                        <input type="number" min="0" id="minStockLevel" th:field="*{minStockLevel}" 
                                               class="form-control-enterprise" placeholder="10" required>
                                        <div class="form-text-error" th:if="${#fields.hasErrors('minStockLevel')}" th:errors="*{minStockLevel}">Min stock error</div>
                                        <div class="text-muted small mt-1">Triggers low stock warnings</div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="description" class="form-label-enterprise">Product Description</label>
                                    <textarea id="description" th:field="*{description}" rows="3" 
                                              class="form-control-enterprise" placeholder="Detailed product specifications and notes"></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/products}" class="btn-secondary-enterprise">Cancel</a>
                                    <button type="submit" class="btn-primary-enterprise">
                                        <i class="bi bi-check-circle"></i>
                                        <span>Save Product Record</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
