<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Stock In Operation')}"></head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/base :: sidebar(${activePage})}"></div>

    <div class="app-main">
        <!-- Header -->
        <header th:replace="~{layout/base :: header('Stock In (Receive Inventory)', 'Home / Stock / Stock In')}"></header>

        <!-- Content -->
        <main class="app-content">
            <!-- Alerts -->
            <div th:replace="~{layout/base :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-enterprise">
                        <div class="card-header-enterprise">
                            <div>
                                <h2 class="card-title-enterprise">Record Incoming Stock</h2>
                                <p class="text-muted small mb-0">Incoming stock units will automatically increase product inventory</p>
                            </div>
                            <a th:href="@{/stock/history}" class="btn-secondary-enterprise">
                                <i class="bi bi-clock-history"></i>
                                <span>Transaction History</span>
                            </a>
                        </div>

                        <div class="card-body-enterprise">
                            <form th:action="@{/stock/in}" method="post">
                                <div class="mb-3">
                                    <label for="productId" class="form-label-enterprise">Select Product *</label>
                                    <select id="productId" name="productId" class="form-select-enterprise" required>
                                        <option value="">Choose Product</option>
                                        <option th:each="p : ${products}" 
                                                th:value="${p.id}" 
                                                th:text="${p.name} + ' (' + ${p.sku} + ') | Current Stock: ' + ${p.quantity}"
                                                th:selected="${selectedProductId == p.id}">
                                            Product Name (SKU)
                                        </option>
                                    </select>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="quantity" class="form-label-enterprise">Incoming Quantity *</label>
                                        <input type="number" min="1" id="quantity" name="quantity" 
                                               class="form-control-enterprise" placeholder="e.g. 50" required>
                                        <div class="text-muted small mt-1">Must be positive whole number</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="supplierId" class="form-label-enterprise">Supplier</label>
                                        <select id="supplierId" name="supplierId" class="form-select-enterprise">
                                            <option value="">Select Supplier (Optional)</option>
                                            <option th:each="sup : ${suppliers}" 
                                                    th:value="${sup.id}" 
                                                    th:text="${sup.name}">Supplier</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="referenceNumber" class="form-label-enterprise">Purchase Order or Reference Number</label>
                                    <input type="text" id="referenceNumber" name="referenceNumber" 
                                           class="form-control-enterprise" placeholder="e.g. PO1006">
                                </div>

                                <div class="mb-4">
                                    <label for="notes" class="form-label-enterprise">Transaction Notes</label>
                                    <textarea id="notes" name="notes" rows="3" 
                                              class="form-control-enterprise" placeholder="Reason, batch number, or receiving remarks"></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard}" class="btn-secondary-enterprise">Cancel</a>
                                    <button type="submit" class="btn-primary-enterprise">
                                        <i class="bi bi-arrow-down-left-square"></i>
                                        <span>Confirm Stock In</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
