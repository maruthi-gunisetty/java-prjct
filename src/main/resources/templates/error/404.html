<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card-enterprise p-5 text-center" style="max-width: 500px;">
        <div class="mb-3 text-secondary">
            <i class="bi bi-compass fs-1 text-primary"></i>
        </div>
        <h1 class="fs-4 fw-bold mb-2">404 Error</h1>
        <h2 class="fs-5 fw-semibold text-secondary mb-3" th:text="${errorTitle != null ? errorTitle : 'Page Not Found'}">Page Not Found</h2>
        <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested URL or resource was not found on this server.'}">
            The requested page does not exist.
        </p>
        <div>
            <a th:href="@{/dashboard}" class="btn-primary-enterprise">
                <i class="bi bi-house"></i>
                <span>Return to Dashboard</span>
            </a>
        </div>
    </div>

</body>
</html>
