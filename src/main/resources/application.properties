# Application Configuration
spring.application.name=Inventory Management System
server.port=8080

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# MySQL Database Settings (Default)
spring.datasource.mysql.host=127.0.0.1
spring.datasource.mysql.port=3306
spring.datasource.mysql.database=inventory_management
spring.datasource.mysql.username=root
spring.datasource.mysql.password=root

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# File and Request Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.inventory=INFO
logging.level.org.springframework.web=INFO
