<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/base :: sidebar(${activePage})}"></div>

    <div class="app-main">
        <!-- Header -->
        <header th:replace="~{layout/base :: header(${pageTitle}, 'Home / Suppliers / ' + ${pageTitle})}"></header>

        <!-- Content -->
        <main class="app-content">
            <!-- Alerts -->
            <div th:replace="~{layout/base :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-enterprise">
                        <div class="card-header-enterprise">
                            <h2 class="card-title-enterprise" th:text="${pageTitle}">Add Supplier</h2>
                            <a th:href="@{/suppliers}" class="btn-secondary-enterprise">
                                <i class="bi bi-arrow-left"></i>
                                <span>Back to Suppliers</span>
                            </a>
                        </div>

                        <div class="card-body-enterprise">
                            <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post">
                                <input type="hidden" th:field="*{id}">

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="name" class="form-label-enterprise">Supplier Company Name *</label>
                                        <input type="text" id="name" th:field="*{name}" 
                                               class="form-control-enterprise" placeholder="e.g. Apex Industrial Supplies" required>
                                        <div class="form-text-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="contactPerson" class="form-label-enterprise">Contact Person</label>
                                        <input type="text" id="contactPerson" th:field="*{contactPerson}" 
                                               class="form-control-enterprise" placeholder="e.g. Robert Vance">
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="email" class="form-label-enterprise">Email Address</label>
                                        <input type="email" id="email" th:field="*{email}" 
                                               class="form-control-enterprise" placeholder="supplier@domain.com">
                                        <div class="form-text-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="phone" class="form-label-enterprise">Phone Number</label>
                                        <input type="text" id="phone" th:field="*{phone}" 
                                               class="form-control-enterprise" placeholder="+1 555 0192">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="address" class="form-label-enterprise">Physical Address</label>
                                    <textarea id="address" th:field="*{address}" rows="3" 
                                              class="form-control-enterprise" placeholder="Full business or dispatch address"></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/suppliers}" class="btn-secondary-enterprise">Cancel</a>
                                    <button type="submit" class="btn-primary-enterprise">
                                        <i class="bi bi-check-circle"></i>
                                        <span>Save Supplier Record</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
